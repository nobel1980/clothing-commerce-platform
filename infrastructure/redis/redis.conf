# Redis Configuration for Clothing Commerce Platform
bind 0.0.0.0
port 6379
protected-mode yes
requirepass secret_redis_pass
timeout 300
tcp-keepalive 60

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance
tcp-backlog 511
databases 16
save 900 1
save 300 10
save 60 10000
