services:
  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - commerce-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    expose:
      - "3000"
    env_file:
      - .env.production
    networks:
      - commerce-network-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: production
    expose:
      - "8000"
    env_file:
      - .env.production
    volumes:
      - api_storage_prod:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - commerce-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: production
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - commerce-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: production
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - commerce-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mysql:
    image: mysql:8.0
    env_file:
      - .env.production
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./infrastructure/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - commerce-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data_prod:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - commerce-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  api_storage_prod:
    driver: local

networks:
  commerce-network-prod:
    driver: bridge
